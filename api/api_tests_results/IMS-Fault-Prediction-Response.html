<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IMS Fault Prediction</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--content-color-primary);
    padding: var(--spacing-m, 12px);
    font-size: 13px;
  }
  h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--content-color-primary);
  }
  .subtitle {
    font-size: 11px;
    color: var(--content-color-secondary, #888);
    margin-bottom: 14px;
  }
  .kpi-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .kpi-card {
    flex: 1;
    min-width: 100px;
    background: var(--background-color-secondary, #f5f5f5);
    border: 1px solid var(--border-color-default, #ddd);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: center;
  }
  .kpi-card .kpi-value {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.2;
  }
  .kpi-card .kpi-label {
    font-size: 10px;
    color: var(--content-color-secondary, #888);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .anomaly { color: #e05c5c; }
  .normal { color: #4caf7d; }
  .neutral { color: var(--content-color-primary); }

  .chart-container {
    position: relative;
    height: 200px;
    margin-bottom: 16px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  thead th {
    background: var(--background-color-secondary, #f5f5f5);
    color: var(--content-color-secondary, #888);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 7px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border-color-default, #ddd);
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--content-color-primary); }
  tbody tr {
    border-bottom: 1px solid var(--border-color-default, #eee);
    transition: background 0.15s;
  }
  tbody tr:hover { background: var(--background-color-secondary, #f9f9f9); }
  tbody td { padding: 7px 10px; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .badge-anomaly { background: rgba(224,92,92,0.15); color: #e05c5c; }
  .badge-normal  { background: rgba(76,175,125,0.15); color: #4caf7d; }

  .score-bar-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .score-bar-bg {
    flex: 1;
    height: 6px;
    background: var(--border-color-default, #ddd);
    border-radius: 3px;
    overflow: hidden;
  }
  .score-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: #e05c5c;
    transition: width 0.4s ease;
  }
  .score-val { min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<h2>IMS Fault Prediction — Run: <span id="run-name"></span></h2>
<p class="subtitle" id="caption">POST /predict/ims · 200 OK · 4 channels analyzed</p>

<div class="kpi-row" id="kpi-row"></div>

<div class="chart-container">
  <canvas id="scoreChart" role="img" aria-label="Anomaly scores per channel bar chart"></canvas>
</div>

<table id="results-table">
  <thead>
    <tr>
      <th data-col="channel">Channel ↕</th>
      <th data-col="anomaly_score">Anomaly Score ↕</th>
      <th data-col="is_anomaly">Status</th>
      <th data-col="model_predict">Model Output</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const data = {"run":"2nd_test","results":[{"channel":"channel_1","anomaly_score":0.1655026098076604,"is_anomaly":true,"model_predict":-1},{"channel":"channel_2","anomaly_score":0.15694868158695574,"is_anomaly":true,"model_predict":-1},{"channel":"channel_3","anomaly_score":0.14988179027387472,"is_anomaly":true,"model_predict":-1},{"channel":"channel_4","anomaly_score":0.15118849470100815,"is_anomaly":true,"model_predict":-1}]};

document.getElementById('run-name').textContent = data.run;

const results = data.results;
const anomalyCount = results.filter(r => r.is_anomaly).length;
const normalCount = results.length - anomalyCount;
const avgScore = results.reduce((s, r) => s + r.anomaly_score, 0) / results.length;
const maxScore = Math.max(...results.map(r => r.anomaly_score));

// KPIs
const kpis = [
  { label: 'Channels', value: results.length, cls: 'neutral' },
  { label: 'Anomalies', value: anomalyCount, cls: 'anomaly' },
  { label: 'Normal', value: normalCount, cls: 'normal' },
  { label: 'Avg Score', value: avgScore.toFixed(4), cls: 'anomaly' },
  { label: 'Max Score', value: maxScore.toFixed(4), cls: 'anomaly' },
];
const kpiRow = document.getElementById('kpi-row');
kpis.forEach(k => {
  const card = document.createElement('div');
  card.className = 'kpi-card';
  card.innerHTML = `<div class="kpi-value ${k.cls}">${k.value}</div><div class="kpi-label">${k.label}</div>`;
  kpiRow.appendChild(card);
});

// Chart
const labels = results.map(r => r.channel.replace('channel_', 'Ch '));
const scores = results.map(r => r.anomaly_score);
const barColors = results.map(r => r.is_anomaly ? 'rgba(224,92,92,0.85)' : 'rgba(76,175,125,0.85)');
const borderColors = results.map(r => r.is_anomaly ? '#e05c5c' : '#4caf7d');

const ctx = document.getElementById('scoreChart').getContext('2d');
new Chart(ctx, {
  type: 'bar',
  data: {
    labels,
    datasets: [{
      label: 'Anomaly Score',
      data: scores,
      backgroundColor: barColors,
      borderColor: borderColors,
      borderWidth: 1.5,
      borderRadius: 5,
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: ctx => {
            const r = results[ctx.dataIndex];
            return [
              ` Score: ${r.anomaly_score.toFixed(6)}`,
              ` Status: ${r.is_anomaly ? '⚠ Anomaly' : '✓ Normal'}`,
              ` Model: ${r.model_predict}`
            ];
          }
        }
      }
    },
    scales: {
      y: {
        beginAtZero: true,
        max: 0.25,
        ticks: { color: 'var(--content-color-secondary, #888)', font: { size: 10 } },
        grid: { color: 'rgba(128,128,128,0.15)' },
        title: { display: true, text: 'Anomaly Score', color: 'var(--content-color-secondary, #888)', font: { size: 10 } }
      },
      x: {
        ticks: { color: 'var(--content-color-secondary, #888)', font: { size: 11 } },
        grid: { display: false }
      }
    }
  }
});

// Table
let sortCol = 'anomaly_score', sortAsc = false;
function renderTable() {
  const sorted = [...results].sort((a, b) => {
    const va = a[sortCol], vb = b[sortCol];
    if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortAsc ? va - vb : vb - va;
  });
  const tbody = document.querySelector('#results-table tbody');
  tbody.innerHTML = '';
  sorted.forEach(r => {
    const tr = document.createElement('tr');
    const pct = (r.anomaly_score / 0.25 * 100).toFixed(1);
    tr.innerHTML = `
      <td><strong>${r.channel}</strong></td>
      <td>
        <div class="score-bar-wrap">
          <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pct}%"></div></div>
          <span class="score-val">${r.anomaly_score.toFixed(5)}</span>
        </div>
      </td>
      <td><span class="badge ${r.is_anomaly ? 'badge-anomaly' : 'badge-normal'}">${r.is_anomaly ? '⚠ Anomaly' : '✓ Normal'}</span></td>
      <td style="font-variant-numeric:tabular-nums">${r.model_predict}</td>
    `;
    tbody.appendChild(tr);
  });
}
renderTable();

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    renderTable();
  });
});
</script>
</body>
</html>
